<!doctype html>
<html lang="es-PE">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal del paciente · Vane Tello</title><meta name="robots" content="noindex">
<link rel="icon" href="brand/VT-Verde.png">
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root{--v:#9BB937;--vo:#617618;--p:#F7FAEF;--t:#41423A;--s:#606158;--b:#DCE9BF}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 3%,#fff 0 14%,transparent 38%),var(--p);color:var(--t);font:16px/1.6 Lato,system-ui,sans-serif}main{width:min(520px,92vw);margin:clamp(3rem,12vh,8rem) auto}header{margin-bottom:2rem}header img{width:180px}h1{font:400 2.3rem/1.2 'Kaushan Script',cursive;color:var(--v);margin:.8rem 0 .25rem}p{color:var(--s);font-weight:400}.card{background:#fff;border:1px solid var(--b);border-radius:18px;padding:1.5rem;box-shadow:0 16px 40px -26px #41423a66}.eyebrow{color:var(--vo);font-size:.75rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin:0}label{display:block;font-size:.78rem;font-weight:900;margin:1rem 0 .35rem}input{width:100%;padding:.8rem;border:1.5px solid var(--b);border-radius:11px;font:1rem Lato}input:focus{outline:3px solid #9bb93755;outline-offset:2px;border-color:var(--v)}button{width:100%;margin-top:1rem;border:0;border-radius:999px;padding:.8rem;background:var(--v);color:#fff;font:900 1rem Lato;cursor:pointer}button:hover{background:var(--vo)}button:focus-visible,a:focus-visible{outline:3px solid var(--v);outline-offset:3px}.help{font-size:.83rem;margin:.65rem 0 0}.links{display:flex;justify-content:space-between;gap:1rem;margin-top:1.4rem;font-size:.88rem}.links a{color:var(--vo);font-weight:900;text-decoration:none}
</style></head>
<body><main><header><img src="brand/VT-Hoja-membretada.png" alt="VT Nutricionistas by Vane Tello"><p class="eyebrow">Para pacientes</p><h1>Tu seguimiento</h1><p>Ingresa tu DNI para revisar tus citas y la información que el equipo tiene registrada.</p></header><section class="card"><form id="acceso"><label for="dni">DNI del paciente</label><input id="dni" name="dni" inputmode="numeric" autocomplete="off" pattern="[0-9]{6,12}" maxlength="12" placeholder="Ej. 12345678" aria-describedby="ayuda-dni" required><p class="help" id="ayuda-dni">Usa solo números, sin espacios ni guiones.</p><button type="submit">Ingresar a mi seguimiento</button></form></section><nav class="links" aria-label="Otros accesos"><a href="admin.html">Acceso administrativo</a><a href="https://tamibot.github.io/vt-descubre/reservar.html">Reservar una cita</a></nav></main><script>document.querySelector('#acceso').addEventListener('submit',e=>{e.preventDefault();const dni=document.querySelector('#dni').value.replace(/\D/g,'');if(/^\d{6,12}$/.test(dni))location.href=`index.html?dni=${encodeURIComponent(dni)}`});</script></body></html>
