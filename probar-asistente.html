<!doctype html>
<html lang="es">
<head><script>/* 30-oct: direcciones viejas (Railway, GitHub) pasan al dominio */if(/\.up\.railway\.app$|\.github\.io$/.test(location.hostname))location.replace('https://portal.vanessatello.com.pe'+location.pathname.replace(/^\/vt-portal/,'')+location.search+location.hash)</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Probar asistente · Lic. Vanessa Tello</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<style>
  body{margin:0;background:#F6F4EE;font-family:Lato,-apple-system,"Segoe UI",Arial,sans-serif;color:#2C2E26}
  .barra{max-width:720px;margin:0 auto;padding:14px 16px 0;display:flex;justify-content:space-between;font-size:14px}
  .barra a{color:#4E6B1E}
  main{max-width:720px;margin:0 auto;padding:12px 16px 28px;display:flex;flex-direction:column;gap:14px}
  h1{font-size:30px;font-weight:900;color:#1F3A2B;margin:4px 0 0}
  p{color:#5A5D50;margin:0;line-height:1.45}
  .chat{background:#fff;border:1px solid #E4E8D6;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:320px}
  .m{padding:9px 12px;border-radius:12px;max-width:85%;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
  .yo{align-self:flex-start;background:#EFE9D8}
  .bot{align-self:flex-end;background:#DDEBC4}
  .nota{align-self:flex-end;font-style:italic;color:#5A5D50;border:1px dashed #D7DCC6}
  form{display:flex;gap:8px}
  input{flex:1;min-width:0;padding:12px;border:1px solid #D7DCC6;border-radius:10px;font:inherit}
  button{padding:12px 16px;border:0;border-radius:10px;background:#1F3A2B;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  button.sec{background:none;color:#4E6B1E;padding:6px 0;text-align:left}
  .ideas{display:flex;flex-wrap:wrap;gap:6px}
  .ideas button{background:#fff;color:#1F3A2B;border:1px solid #D7DCC6;font-weight:400;padding:7px 10px;font-size:14px}
  .err{color:#B3261E;min-height:18px;font-size:14px}
  :focus-visible{outline:2px solid #4E6B1E;outline-offset:2px}
</style>
</head>
<body>
<div class="barra"><a href="guia.html">← Guía de uso</a><a href="equipo.html">Portal del equipo</a></div>
<main id="vista"></main>
<script>
const API = 'https://primary-production-9caaf.up.railway.app/webhook/asistente-prueba-vt';
const $v = document.getElementById('vista');
const leer = () => { try { return sessionStorage.getItem('clave') || ''; } catch (e) { return ''; } };
const guardar = v => { try { v ? sessionStorage.setItem('clave', v) : sessionStorage.removeItem('clave'); } catch (e) {} };
const IDEAS = ['Cuánto cuesta la cita?', 'Soy paciente bariátrica, tienen paquetes?', 'Atienden adolescentes?', 'Cuánto cuesta el programa integral?', 'Tienen estacionamiento?', 'Puedo comer dulces?'];
let historial = [];

function acceso(msg = '') {
  $v.innerHTML = `<h1>Probar el asistente</h1><p>Escribe la clave del equipo para entrar.</p>
    <form id="f"><input id="c" type="password" autocomplete="current-password" aria-label="Clave del equipo" required><button>Entrar</button></form>
    <div class="err">${msg}</div>`;
  document.getElementById('f').onsubmit = e => { e.preventDefault(); guardar(document.getElementById('c').value.trim()); pantalla(); };
}

function pantalla() {
  if (!leer()) return acceso();
  historial = [];
  $v.innerHTML = `<h1>Probar el asistente</h1>
    <p>Escríbele como lo haría una paciente. Nada de esto se envía a nadie: es solo una prueba.</p>
    <div class="ideas" id="ideas">${IDEAS.map(t => `<button type="button">${t}</button>`).join('')}</div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <form id="f"><input id="t" maxlength="800" placeholder="Escribe un mensaje" aria-label="Tu mensaje" autocomplete="off" required><button id="b">Enviar</button></form>
    <div class="err" id="e"></div>
    <button type="button" class="sec" id="n">Empezar otra conversación</button>`;
  document.getElementById('f').onsubmit = e => { e.preventDefault(); const i = document.getElementById('t'); const t = i.value.trim(); i.value = ''; if (t) enviar(t); };
  document.getElementById('n').onclick = pantalla;
  document.getElementById('ideas').onclick = e => { if (e.target.tagName === 'BUTTON') enviar(e.target.textContent); };
}

function pintar(texto, clase) {
  const d = document.createElement('div'); d.className = 'm ' + clase; d.textContent = texto;
  const c = document.getElementById('chat'); c.append(d); c.scrollTop = c.scrollHeight; return d;
}

async function enviar(texto) {
  const b = document.getElementById('b'), e = document.getElementById('e');
  e.textContent = ''; b.disabled = true; pintar(texto, 'yo');
  historial.push({ role: 'user', content: texto });
  const espera = pintar('Escribiendo…', 'nota');
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ clave: leer(), historial }) });
    const d = await r.json().catch(() => ({}));
    espera.remove();
    if (r.status === 401) { guardar(''); return acceso('Clave incorrecta.'); }
    if (!d.ok) throw new Error();
    if (d.respuesta) { pintar(d.respuesta, 'bot'); historial.push({ role: 'assistant', content: d.respuesta }); }
    else pintar(d.nota, 'nota');
  } catch (x) {
    espera.remove(); historial.pop();
    e.textContent = 'No se pudo responder. Prueba otra vez en un minuto.';
  }
  b.disabled = false;
}
pantalla();
</script>
</body>
</html>
