<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Informes · Lic. Vanessa Tello</title>
<style>
  body{margin:0;background:#F6F4EE;font-family:-apple-system,"Segoe UI",Lato,Arial,sans-serif;color:#2C2E26}
  .caja{max-width:380px;margin:12vh auto;background:#fff;border:1px solid #E4E8D6;border-radius:16px;padding:28px 24px}
  h1{font-size:22px;margin:0 0 6px;color:#1F3A2B} p{color:#5A5D50;font-size:14px;margin:0 0 16px}
  label{font-size:13px;font-weight:700} input{width:100%;box-sizing:border-box;margin:6px 0 14px;padding:11px 12px;border:1px solid #D7DCC6;border-radius:10px;font-size:15px}
  button{width:100%;padding:12px;border:0;border-radius:10px;background:#1F3A2B;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .err{color:#B3261E;font-size:13px;min-height:18px} .cargando{text-align:center;color:#6A7160;margin:20vh 0}
  .barra{max-width:980px;margin:0 auto;padding:12px 16px 0;display:flex;justify-content:space-between;font-size:13px}
  .barra a{color:#4E6B1E}
</style>
</head>
<body>
<div id="vista"></div>
<script>
// 27-oct: los informes viven en el portal (antes en una dirección de n8n). Misma clave que
// el portal del equipo: si ya entraste a equipo.html en esta pestaña, no la vuelve a pedir.
const API = 'https://primary-production-9caaf.up.railway.app/webhook/informes-datos-vt';
const $v = document.getElementById('vista');
const guardar = v => { try { v ? sessionStorage.setItem('clave', v) : sessionStorage.removeItem('clave'); } catch (e) {} };
const leer = () => { try { return sessionStorage.getItem('clave') || ''; } catch (e) { return ''; } };
function pedirClave(msg = '') {
  $v.innerHTML = `<form class="caja" id="f"><h1>Informes</h1><p>Lic. Vanessa Tello · Nutri 360</p>
    <label for="c">Clave del equipo</label><input id="c" type="password" autocomplete="current-password" required>
    <div class="err">${msg}</div><button>Entrar</button></form>`;
  document.getElementById('f').onsubmit = e => { e.preventDefault(); const c = document.getElementById('c').value.trim(); guardar(c); cargar(c); };
}
async function cargar(clave) {
  if (!clave) return pedirClave();
  $v.innerHTML = '<div class="cargando">Armando el informe…</div>';
  const q = new URLSearchParams(location.search), pedido = { clave };
  if (/^\d{4}-\d{2}$/.test(q.get('mes') || '')) pedido.mes = q.get('mes');
  else if (/^\d{1,3}$/.test(q.get('dias') || '')) pedido.dias = q.get('dias');
  try {
    // text/plain: sin preflight de CORS, igual que el portal del equipo.
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(pedido) });
    const d = await r.json().catch(() => ({}));
    if (!d.ok) { guardar(''); return pedirClave(d.motivo || 'No se pudo abrir el informe.'); }
    const doc = new DOMParser().parseFromString(d.html, 'text/html');
    $v.innerHTML = `<div class="barra"><a href="equipo.html">← Portal del equipo</a><a href="#" id="salir">Salir</a></div>` + doc.body.innerHTML;
    document.getElementById('salir').onclick = e => { e.preventDefault(); guardar(''); pedirClave(); };
  } catch (e) {
    $v.innerHTML = '<div class="cargando">No hay conexión con el servidor. Prueba otra vez en un minuto.</div>';
  }
}
cargar(leer());
</script>
</body>
</html>
