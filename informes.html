<!doctype html>
<html lang="es">
<head><script>/* 30-oct: direcciones viejas (Railway, GitHub) pasan al dominio */if(/\.up\.railway\.app$|\.github\.io$/.test(location.hostname))location.replace('https://portal.vanessatello.com.pe'+location.pathname.replace(/^\/vt-portal/,'')+location.search+location.hash)</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Informes · Lic. Vanessa Tello</title>
<style>
  body{margin:0;background:#F6F4EE;font-family:-apple-system,"Segoe UI",Lato,Arial,sans-serif;color:#2C2E26}
  .caja{max-width:380px;margin:12vh auto;background:#fff;border:1px solid #E4E8D6;border-radius:16px;padding:28px 24px}
  h1{font-size:22px;margin:0 0 6px;color:#1F3A2B} p{color:#5A5D50;font-size:14px;margin:0 0 16px}
  label{font-size:13px;font-weight:700} input{width:100%;box-sizing:border-box;margin:6px 0 14px;padding:11px 12px;border:1px solid #D7DCC6;border-radius:10px;font-size:15px}
  button{width:100%;padding:12px;border:0;border-radius:10px;background:#1F3A2B;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .err{color:#B3261E;font-size:13px;min-height:18px} .cargando{text-align:center;color:#6A7160;margin:20vh 0}
  .barra{max-width:980px;margin:0 auto;padding:12px 16px 0;display:flex;justify-content:space-between;font-size:13px}
  .barra a{color:#4E6B1E}
  .excel{max-width:980px;margin:10px auto 0;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:14px;background:#fff;border:1px solid #E4E8D6;border-radius:14px;box-sizing:border-box}
  .excel label{display:flex;gap:6px;align-items:center;color:#5A5D50}
  .excel input,.excel select{font:inherit;padding:5px 8px;border:1px solid #DCE3C8;border-radius:8px;background:#fff}
  .excel button{font:inherit;font-weight:700;background:#4E6B1E;color:#FBFBF8;border:0;border-radius:99px;padding:8px 16px;cursor:pointer}
  .excel .estado{color:#5A5D50;font-size:13px}
  #resumen-pacientes{max-width:980px;margin:10px auto 0;padding:0 16px;box-sizing:border-box}
  .resumen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .caja-res{background:#fff;border:1px solid #E4E8D6;border-radius:14px;padding:12px 14px;font-size:14px}
  .caja-res h3{margin:0 0 6px;font-size:15px;color:#1F3A2B}.caja-res table{width:100%;border-collapse:collapse}
  .caja-res td{padding:3px 0;border-top:1px solid #F0F2E8}.nota-res{margin:0 0 6px;color:#5A5D50;font-size:12px}
</style>
</head>
<body>
<div id="vista"></div>
<script>
if (location.hostname === 'tamibot.github.io') location.replace('https://portal.vanessatello.com.pe' + location.pathname.replace(/^\/vt-portal/, '') + location.search);  // 29-oct: favoritos con la dirección vieja
// 27-oct: los informes viven en el portal (antes en una dirección de n8n). Misma clave que
// el portal del equipo: si ya entraste a equipo.html en esta pestaña, no la vuelve a pedir.
const API = 'https://primary-production-9caaf.up.railway.app/webhook/informes-datos-vt';
const $v = document.getElementById('vista');
const guardar = v => { try { v ? sessionStorage.setItem('clave', v) : sessionStorage.removeItem('clave'); } catch (e) {} };
const leer = () => { try { return sessionStorage.getItem('clave') || ''; } catch (e) { return ''; } };
function pedirClave(msg = '') {
  $v.innerHTML = `<form class="caja" id="f"><h1>Informes</h1><p>Lic. Vanessa Tello · Nutri 360</p>
    <label for="c">Clave del equipo</label><input id="c" type="password" autocomplete="current-password" required>
    <div class="err">${msg}</div><button>Entrar</button></form>`;
  document.getElementById('f').onsubmit = e => { e.preventDefault(); const c = document.getElementById('c').value.trim(); guardar(c); cargar(c); };
}
async function cargar(clave) {
  if (!clave) return pedirClave();
  $v.innerHTML = '<div class="cargando">Armando el informe…</div>';
  const q = new URLSearchParams(location.search), pedido = { clave };
  if (/^\d{4}-\d{2}$/.test(q.get('mes') || '')) pedido.mes = q.get('mes');
  else if (/^\d{1,3}$/.test(q.get('dias') || '')) pedido.dias = q.get('dias');
  try {
    // text/plain: sin preflight de CORS, igual que el portal del equipo.
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(pedido) });
    const d = await r.json().catch(() => ({}));
    if (!d.ok) { guardar(''); return pedirClave(d.motivo || 'No se pudo abrir el informe.'); }
    const doc = new DOMParser().parseFromString(d.html, 'text/html');
    $v.innerHTML = `<div class="barra"><a href="equipo.html">← Portal del equipo</a><a href="#" id="salir">Salir</a></div>` + doc.body.innerHTML;
    document.querySelector('.barra').insertAdjacentHTML('afterend', `<div class="excel" id="filtros-excel"><b>Reporte de citas en Excel</b> (formato de Sheilla)
      <label>Desde <input type="date" id="f-desde" value="${mesActual()}-01"></label>
      <label>Hasta <input type="date" id="f-hasta" value="${finDeMes(mesActual())}"></label>
      <button type="button" id="corte-clinica" style="background:#fff;color:#4E6B1E;border:1px solid #4E6B1E">Corte clínica (25 al 24)</button>
      <label>Nutricionista <select id="f-nutri"><option value="">Todas</option><option>Vanessa Tello</option><option>Nutricionista VT</option></select></label>
      <label>Llega por <select id="f-llega"><option value="">Todos</option></select></label>
      <button type="button" id="excel">⬇ Descargar Excel</button> <button type="button" id="ver-resumen" style="background:#fff;color:#4E6B1E;border:1px solid #4E6B1E">Ver pacientes y comisiones</button> <span class="estado">Cargando opciones…</span></div>
      <div id="resumen-pacientes"></div>`);
    document.getElementById('excel').onclick = descargarReporte; document.getElementById('ver-resumen').onclick = verResumen; pintarFiltros();
    // 13-nov (Sheilla): la clínica Avendaño paga del 25 de un mes al 24 del siguiente.
    document.getElementById('corte-clinica').onclick = () => { const [y, m] = mesActual().split('-').map(Number);
      document.getElementById('f-desde').value = new Date(Date.UTC(y, m - 2, 25)).toISOString().slice(0, 10);
      document.getElementById('f-hasta').value = new Date(Date.UTC(y, m - 1, 24)).toISOString().slice(0, 10);
      document.getElementById('f-llega').value = 'Clínica Avendaño'; };
    document.getElementById('salir').onclick = e => { e.preventDefault(); guardar(''); pedirClave(); };
  } catch (e) {
    $v.innerHTML = '<div class="cargando">No hay conexión con el servidor. Prueba otra vez en un minuto.</div>';
  }
}

// 13-nov: «Descargar Excel» con el formato del reporte mensual de Sheilla (mismas hojas y columnas),
// filtrable por mes, nutricionista y «llega por». Datos de citas-datos-vt con la misma clave.
const DATOS = 'https://primary-production-9caaf.up.railway.app/webhook/citas-datos-vt';
function zipSinComprimir(partes) {
  const enc = new TextEncoder(), tabla = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
  const crc = b => { let c = 0xFFFFFFFF; for (const x of b) c = tabla[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const cabecera = (firma, resto) => { const u = new Uint8Array(resto.reduce((s, [, n]) => s + n, 4)), d = new DataView(u.buffer); d.setUint32(0, firma, true); let i = 4;
    for (const [v, n] of resto) { n === 2 ? d.setUint16(i, v, true) : d.setUint32(i, v, true); i += n; } return u; };
  const trozos = [], central = []; let pos = 0;
  for (const [nombre, texto] of partes) {
    const n = enc.encode(nombre), b = enc.encode(texto), c = crc(b);
    const comun = [[0, 2], [0, 2], [0, 2], [33, 2], [c, 4], [b.length, 4], [b.length, 4], [n.length, 2], [0, 2]];
    const local = cabecera(0x04034b50, [[20, 2], ...comun]);
    central.push(cabecera(0x02014b50, [[20, 2], [20, 2], ...comun, [0, 2], [0, 2], [0, 2], [0, 4], [pos, 4]]), n);
    trozos.push(local, n, b); pos += local.length + n.length + b.length;
  }
  const largo = central.reduce((s, u) => s + u.length, 0);
  return new Blob([...trozos, ...central, cabecera(0x06054b50, [[0, 2], [0, 2], [partes.length, 2], [partes.length, 2], [largo, 4], [pos, 4], [0, 2]])],
    { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
function libroExcel(archivo, hojas) {
  const x = s => String(s ?? '').replace(/[^\u0009\u000A\u000D -퟿-�]/g, '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const col = n => n < 26 ? String.fromCharCode(65 + n) : String.fromCharCode(64 + Math.floor(n / 26)) + String.fromCharCode(65 + n % 26);
  const serial = f => (Date.UTC(+f.slice(0, 4), +f.slice(5, 7) - 1, +f.slice(8, 10)) - Date.UTC(1899, 11, 30)) / 864e5;
  const celda = (v, i, f, estilo) => v === '' || v === null || v === undefined ? ''
    : typeof v === 'object' && v.fecha ? `<c r="${col(i)}${f}" s="2"><v>${serial(v.fecha)}</v></c>`
    : typeof v === 'number' ? `<c r="${col(i)}${f}"${estilo}><v>${v}</v></c>`
    : `<c r="${col(i)}${f}" t="inlineStr"${estilo}><is><t xml:space="preserve">${x(v)}</t></is></c>`;
  const fila = (vals, f, estilo = '') => `<row r="${f}">${vals.map((v, i) => celda(v, i, f, estilo)).join('')}</row>`;
  const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>', M = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main', R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const partes = [
    ['[Content_Types].xml', `${X}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${hojas.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
    ['_rels/.rels', `${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml', `${X}<workbook xmlns="${M}" xmlns:r="${R}"><sheets>${hojas.map((h, i) => `<sheet name="${x(h.nombre)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels', `${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${hojas.map((_, i) => `<Relationship Id="rId${i + 1}" Type="${R}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${hojas.length + 1}" Type="${R}/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml', `${X}<styleSheet xmlns="${M}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="14" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs></styleSheet>`],
    ...hojas.map((h, i) => {
      const anchos = h.cab.map((c, j) => Math.min(45, Math.max(String(c).length, ...h.filas.map(r => r[j]?.fecha ? 10 : String(r[j] ?? '').length)) + 2));
      return [`xl/worksheets/sheet${i + 1}.xml`, `${X}<worksheet xmlns="${M}"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${anchos.map((w, j) => `<col min="${j + 1}" max="${j + 1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${fila(h.cab, 1, ' s="1"')}${h.filas.map((r, k) => fila(r, k + 2)).join('')}</sheetData>${h.filas.length ? `<autoFilter ref="A1:${col(h.cab.length - 1)}${h.filas.length + 1}"/>` : ''}</worksheet>`];
    })];
  const a = document.createElement('a'); a.href = URL.createObjectURL(zipSinComprimir(partes)); a.download = archivo; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
let CITAS = null;
const sinT = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const telN = t => String(t || '').replace(/\D/g, '').slice(-9);
// Ficha de la paciente: nombre exacto; si no, mismo teléfono; si no, mismas palabras del nombre en cualquier orden
// (la base vino como «Apellidos Nombres» y las citas como «Nombres Apellidos»). Con varias fichas, la más completa.
const clave = n => sinT(n).split(/\s+/).filter(Boolean).sort().join(' ');
let INDICE = null;
function fichaDe(c) {
  if (!INDICE) { INDICE = { tel: new Map(), nom: new Map() };
    const peso = x => ['dni', 'sexo', 'llega_por', 'fecha_nacimiento', 'tipo_paciente'].filter(k => x[k]).length;
    for (const x of CITAS.pacientes) for (const [m, k] of [[INDICE.tel, telN(x.telefono)], [INDICE.nom, clave(x.nombre)]])
      if (k && (!m.has(k) || peso(x) > peso(m.get(k)))) m.set(k, x); }
  const exacta = CITAS.pacientes.find(x => x.nombre === c.paciente && (!c.telefono || !x.telefono || telN(x.telefono) === telN(c.telefono)));
  const base = exacta || (telN(c.telefono) && INDICE.tel.get(telN(c.telefono))) || INDICE.nom.get(clave(c.paciente)) || {};
  // completa los datos que le falten a la ficha exacta con la de igual teléfono/nombre
  const otra = (telN(c.telefono) && INDICE.tel.get(telN(c.telefono))) || INDICE.nom.get(clave(c.paciente)) || {};
  return Object.fromEntries([...new Set([...Object.keys(otra), ...Object.keys(base)])].map(k => [k, base[k] || otra[k]]));
}
const llegaPor = f => { const v = String(f.llega_por || '').trim(); return /avenda/i.test(v) ? 'Clínica Avendaño' : /tik ?tok/i.test(v) ? 'TikTok' : /referid/i.test(v) ? 'Referido de paciente' : /instagram/i.test(v) ? 'Instagram' : /facebook/i.test(v) ? 'Facebook' : v; };
const nutri = c => c.profesional === 'Lic. Vanessa Tello' ? 'Vanessa Tello' : 'Nutricionista VT';
const edad = (nac, dia) => { if (!nac) return ''; let e = +dia.slice(0, 4) - +nac.slice(0, 4); if (dia.slice(5) < nac.slice(5, 10)) e--; return e >= 0 && e < 120 ? e : ''; };
const finDeMes = m => { const [y, n] = m.split('-').map(Number); return new Date(Date.UTC(y, n, 0)).toISOString().slice(0, 10); };
const mesActual = () => { const q = new URLSearchParams(location.search).get('mes'); return /^\d{4}-\d{2}$/.test(q || '') ? q : new Date(Date.now() - 5 * 36e5).toISOString().slice(0, 7); };
async function datosCitas() {
  if (CITAS) return CITAS;
  const r = await fetch(DATOS, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ clave: leer() }) });
  const d = await r.json().catch(() => ({}));
  if (!d.citas) throw new Error(d.motivo || 'No se pudieron traer las citas.');
  return CITAS = d;
}
async function pintarFiltros() {
  const caja = document.getElementById('filtros-excel'); if (!caja) return;
  try { await datosCitas(); } catch (e) { caja.querySelector('.estado').textContent = e.message; return; }
  const opciones = [...new Set(CITAS.pacientes.map(llegaPor).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
  caja.querySelector('#f-llega').innerHTML = '<option value="">Todos</option>' + opciones.map(o => `<option>${o.replace(/[&<>"]/g, '')}</option>`).join('') + '<option value="(sin dato)">Sin dato</option>';
  caja.querySelector('.estado').textContent = '';
}
function filasDelMes() {
  const m0 = mesActual(), desde = document.getElementById('f-desde').value || m0 + '-01', hasta = document.getElementById('f-hasta').value || finDeMes(m0);
  const mes = desde.slice(0, 7) === hasta.slice(0, 7) && desde.endsWith('-01') && hasta === finDeMes(desde.slice(0, 7)) ? desde.slice(0, 7) : desde + '_' + hasta, prof = document.getElementById('f-nutri').value, lp = document.getElementById('f-llega').value;
  return { mes, citas: CITAS.citas.filter(c => c.fecha >= desde && c.fecha <= hasta && ['Asistió', 'No asistió'].includes(c.estado)
    && (!prof || nutri(c) === prof) && (!lp || (lp === '(sin dato)' ? !llegaPor(fichaDe(c)) : llegaPor(fichaDe(c)) === lp)))
    .sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora)) };
}
// 13-nov (pendientes 16 y 17): pacientes del periodo por edad, sexo, paquete y origen, y comisiones
// (pacientes nuevos por origen, sin Avendaño, como pidió Vanessa el 9-nov). Mismos filtros que el Excel.
async function verResumen() {
  const caja = document.getElementById('resumen-pacientes'), est = document.querySelector('#filtros-excel .estado');
  est.textContent = 'Armando el resumen…';
  try { await datosCitas(); } catch (e) { est.textContent = e.message; return; }
  const { mes, citas } = filasDelMes(), at = citas.filter(c => c.estado === 'Asistió');
  const personas = new Map(); at.forEach(c => { const k = sinT(c.paciente) + '|' + telN(c.telefono); if (!personas.has(k)) personas.set(k, c); });
  const P = [...personas.values()], nuevos = at.filter(c => c.tipo === 'Primera cita');
  const cuenta = (lista, f) => { const m = new Map(); lista.forEach(x => { const k = f(x) || 'Sin dato'; m.set(k, (m.get(k) || 0) + 1); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); };
  const rango = c => { const e = edad(fichaDe(c).fecha_nacimiento, c.fecha); return e === '' ? 'Sin fecha de nacimiento' : e < 18 ? 'Menos de 18' : e < 30 ? '18 a 29' : e < 40 ? '30 a 39' : e < 50 ? '40 a 49' : e < 60 ? '50 a 59' : '60 o más'; };
  const tabla = (titulo, filas, nota = '') => `<div class="caja-res"><h3>${titulo}</h3>${nota ? `<p class="nota-res">${nota}</p>` : ''}<table>${filas.map(([k, n]) => `<tr><td>${String(k).replace(/[&<>]/g, '')}</td><td style="text-align:right"><b>${n}</b></td></tr>`).join('')}</table></div>`;
  const sinAven = nuevos.filter(c => !/avenda/.test(sinT(fichaDe(c).llega_por)));
  caja.innerHTML = `<div class="resumen-grid">
    ${tabla('Comisiones: pacientes nuevos', [['Nuevos (primera cita)', nuevos.length], ['Nuevos sin Avendaño', sinAven.length], ['De Avendaño', nuevos.length - sinAven.length]], 'Nuevos = citas atendidas marcadas «Primera cita».')}
    ${tabla('Nuevos sin Avendaño, por cómo llegaron', cuenta(sinAven, c => llegaPor(fichaDe(c))))}
    ${tabla('Nuevos por nutricionista', cuenta(nuevos, nutri))}
    ${tabla('Pacientes atendidos por sexo', cuenta(P, c => fichaDe(c).sexo), `${P.length} pacientes distintos · ${at.length} consultas`)}
    ${tabla('Por edad', cuenta(P, rango), 'Sale de la fecha de nacimiento de la ficha.')}
    ${tabla('Por cómo llegaron', cuenta(P, c => llegaPor(fichaDe(c))))}
    ${tabla('Servicios y paquetes más vendidos', cuenta(at, c => c.servicio || c.modalidad).slice(0, 12), 'Consultas atendidas por servicio.')}
  </div>`;
  est.textContent = `Resumen ${mes.includes('_') ? mes.replace('_', ' al ') : mes}: ${at.length} consultas atendidas.`;
}
async function descargarReporte() {
  const est = document.querySelector('#filtros-excel .estado'); est.textContent = 'Armando el Excel…';
  try { await datosCitas(); } catch (e) { est.textContent = e.message; return; }
  const { mes, citas } = filasDelMes(), F = c => ({ fecha: c });
  const inicioPaq = id => CITAS.citas.filter(x => x.paquete_id === id && x.estado !== 'Cancelada').map(x => x.fecha).sort()[0];
  const pagado = c => ['Pagado', 'Paquete', 'Cortesía'].includes(c.pago);
  const monto = c => c.monto_pagado != null ? Number(c.monto_pagado) : c.monto != null ? Number(c.monto) : '';
  const reporte = citas.map(c => { const f = fichaDe(c), fp = c.fecha_pago || '';
    return [F(c.fecha), +c.fecha.slice(5, 7), c.paciente, f.dni || '', f.sexo || '', c.telefono || f.telefono || '', c.email || f.email || '', llegaPor(f), f.tipo_paciente || '',
      nutri(c), c.servicio || c.modalidad || '', monto(c), c.paquete_id ? F(inicioPaq(c.paquete_id)) : '', c.nro_paquete || '', pagado(c) ? 'Si' : 'No',
      fp ? F(fp) : '', fp ? +fp.slice(5, 7) : '', c.medio_pago || '', '', c.tipo === 'Primera cita' ? 'Si' : '', c.estado === 'Asistió' ? 'Si' : 'No', ''];
  });
  const at = citas.filter(c => c.estado === 'Asistió'), nuevos = at.filter(c => c.tipo === 'Primera cita');
  const nCon = re => nuevos.filter(c => re.test(sinT(fichaDe(c).llega_por))).length || '-';
  const resumen = [
    ['Pacientes atendidos TOTAL', at.length], ['Pacientes atendidos por VT', at.filter(c => nutri(c) === 'Vanessa Tello').length],
    ['Pacientes atendidos por nutri del equipo', at.filter(c => nutri(c) !== 'Vanessa Tello').length], ['Pacientes nuevos TOTAL', nuevos.length],
    ['Paciente nuevos de Redes', nCon(/instagram|tik ?tok|facebook|redes/)], ['Paciente nuevos de referidos', nCon(/referid/)],
    ['Pacientes Avendaño nuevos', nCon(/avenda/)], ['Pacientes Dr. Salazar nuevos', nCon(/salazar/)], ['Paciente nuevos Dra Hellen', nCon(/hellen/)],
    ['Paciente nuevos Dr. Bringas', nCon(/bringas/)], ['Paciente nuevos Dra. Yara', nCon(/yara/)], ['Paciente nuevos Dr. Erick', nCon(/erick/)],
    ['Paciente nuevos Dr. Rodriguez', nCon(/rodriguez/)], ['Cobrado en citas atendidas (S/)', at.filter(pagado).reduce((s, c) => s + (Number(monto(c)) || 0), 0)]];
  const aven = at.filter(c => /avenda/.test(sinT(fichaDe(c).llega_por)));
  const prepost = aven.filter(c => /pre |post |pre-|post-|operaci/.test(sinT((c.tipo || '') + ' ' + (c.servicio || ''))));
  const partir = n => { const t = String(n).trim().split(/\s+/); return t.length < 3 ? [t[1] || '', '', t[0] || '', ''] : [t[t.length - 2], t[t.length - 1], t[0], t.slice(1, -2).join(' ')]; };
  const salazar = citas.filter(c => /salazar/.test(sinT((c.servicio || '') + ' ' + fichaDe(c).llega_por)));
  const hojas = [
    { nombre: 'REPORTE DE CITAS', cab: ['FECHA CITA', 'MES', 'APELLIDOS Y NOMBRES', 'DNI', 'SEXO', 'TELEFONO', 'CORREO', 'LLEGA POR', 'DETALLE PACIENTE', 'NUTRICIONISTA', 'MODALIDAD', 'MONTO DE PAGO', 'FECHA INICIO PAQUETE', 'N° CONSULTA PAQUETE', 'PAGO', 'FECHA DE PAGO', 'MES DE PAGO', 'FORMA DE PAGO', 'N° OP', 'PRIMERA CITA', 'ASISTIO A LA CITA', 'MOTIVO (SI NO ASISTIO A LA CITA)'], filas: reporte },
    { nombre: 'RESUMEN DEL MES', cab: ['RESUMEN DEL MES', mes.includes('_') ? mes.replace('_', ' al ') : mes], filas: resumen },
    { nombre: 'CITA PRE Y POST AVENDAÑO', cab: ['N°', 'FECHA', 'NUMERO DE DNI O RUC', 'PACIENTE', 'DIAGNOSTICO', 'EDAD', 'MEDICO TRATANTE', 'OBSERVACIONES Y/O COMENTARIOS DE IMPORTANCIA', 'COMPROBANTE DE PAGO', 'IMPORTE'],
      filas: prepost.map((c, i) => { const f = fichaDe(c); return [i + 1, F(c.fecha), f.dni || '', c.paciente, c.tipo || '', edad(f.fecha_nacimiento, c.fecha), '', '', '', monto(c)]; }) },
    { nombre: 'CITAS DEL MES AVENDAÑO', cab: ['DNI', 'Tipo de DOC', '1ER APELLIDO', '2DO APELLIDO', '1ER NOMBRE', '2DO NOMBRE', 'Sexo', 'Edad', 'Fecha de Atención'],
      filas: aven.map(c => { const f = fichaDe(c), [a1, a2, n1, n2] = partir(c.paciente); return [f.dni || '', f.dni ? 'DNI' : '', a1, a2, n1, n2, f.sexo || '', edad(f.fecha_nacimiento, c.fecha), F(c.fecha)]; }) },
    { nombre: 'CITAS DR. SALAZAR - XIMENA', cab: ['FECHA CITA', 'APELLIDOS Y NOMBRES', 'N° CONSULTA PAQUETE', 'DETALLE PACIENTE', 'MONTO DE PAGO'],
      filas: salazar.map(c => [F(c.fecha), c.paciente, c.nro_paquete || '', fichaDe(c).tipo_paciente || c.tipo || '', monto(c)]) }];
  const prof = document.getElementById('f-nutri').value, lp = document.getElementById('f-llega').value;
  libroExcel(`reporte-citas-${mes}${prof ? '-' + sinT(prof).replace(/\W+/g, '-') : ''}${lp ? '-' + sinT(lp).replace(/\W+/g, '-') : ''}.xlsx`, hojas);
  est.textContent = `Descargado: ${reporte.length} citas (${at.length} atendidas).`;
}
cargar(leer());
</script>
